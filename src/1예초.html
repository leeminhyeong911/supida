<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link href="user2.css" rel="stylesheet">
  <link href="Custom1.css" rel="stylesheet">
  <link href="Custom2.css" rel="stylesheet" type="text/css">
  <style>
    .nav-btn { width:28px; height:22px; display:none; flex-direction:column; justify-content:space-between; cursor:pointer; z-index:9999; }
    .nav-btn span { display:block; width:100%; height:3px; background:#002157; border-radius:3px; }
    @media (max-width:980px) {
      #nav { position:fixed; top:0; right:-260px; width:260px; height:100vh; background:white; padding:80px 30px; display:flex !important; flex-direction:column; gap:25px; transition:right .3s ease; z-index:9998; box-shadow:-4px 0 12px rgba(0,0,0,0.2); }
      #nav.open { right:0; }
      .nav-btn { display:flex; }
      .nav-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); display:none; z-index:9990; }
      .nav-bg.active { display:block !important; }
    }
    .slider { position:relative; height:600px; overflow:hidden; }
    .slide { position:absolute; width:100%; height:100%; opacity:0; transition:1s; }
    .slide.active { opacity:1; }
    .slide img { width:100%; height:100%; object-fit:cover; }
    .text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; text-align:center; }
    .text h1 { font-size:50px; }
    .text p { font-size:20px; }
    .ba-section { max-width:1200px; margin:60px auto; padding:0 20px; }
    .ba-box { background:#fff; border:1px solid #ddd; padding:20px; }
    .ba-info { display:flex; border-bottom:1px solid #ddd; margin-bottom:20px; }
    .ba-info div { flex:1; text-align:center; padding:10px; font-size:14px; color:#555; }
    .ba-content { position:relative; }
    .ba-after-img { width:100%; display:block; }
    .ba-after-label { position:absolute; right:40px; bottom:30px; color:white; font-size:40px; font-weight:bold; }
    .ba-before-card { position:absolute; left:40px; bottom:40px; width:300px; box-shadow:0 10px 30px rgba(0,0,0,0.2); border-radius:8px; overflow:hidden; }
    .ba-before-card img { width:100%; }
    .ba-before-label { position:absolute; bottom:10px; right:15px; color:white; font-size:20px; }
    .ba-desc { margin-top:20px; color:#666; }
    @media (max-width:768px) {
      .ba-before-card { width:180px; left:15px; bottom:15px; }
      .ba-after-label { font-size:24px; right:15px; bottom:15px; }
    }
  </style>
</head>
<body>
<div id="wrapper">

  <div id="header">
    <div id="header_in">
      <div id="L_SITE_LOGO">
        <h1><a href="/"><img src="logo1.png" width="120" height="50" border="0" loading="lazy"></a></h1>
      </div>
      <div class="nav-btn"><span></span><span></span><span></span></div>
      <nav id="nav">
        <div class="util-menu" style="visibility:hidden;">
          <ul>
            <li id="loginMenu"><a href="/login">LOGIN</a></li>
            <li id="joinMenu"><a href="/join">JOIN</a></li>
            <li id="logoutMenu" style="display:none;"><a href="#" onclick="logoutUser()">LOGOUT</a></li>
          </ul>
        </div>
        <h2 class="hidden">사이트 메뉴</h2>
        <ul class="navigation">
          <li>
            <a href="#" class="main-menu">회사소개</a>
            <div class="sub-menu">
              <a href="/boss">회사 소개</a>
              <a href="/map">찾아오시는 길</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">예초 작업</a>
            <div class="sub-menu">
              <a href="/menu1">작업 소개</a>
              <a href="/menu2">시공 사례</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">위험 수목</a>
            <div class="sub-menu">
              <a href="/menu3">작업 소개</a>
              <a href="/menu4">시공 사례</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">고객센터</a>
            <div class="sub-menu">
              <a href="/FAQ">FAQ</a>
              <a href="/qna">문의하기</a>
              <a href="/estimate">견적 계산기</a>
            </div>
          </li>
        </ul>
      </nav>
      <div class="nav-bg"></div>
    </div>
  </div>

  <div class="slider">
    <div class="slide active">
      <img src="나무전지후.png" loading="eager">
      <div class="text">
        <h1>전문 예초 서비스</h1>
        <p>잡초 제거부터 정원 관리까지 완벽하게</p>
      </div>
    </div>
  </div>

  <div class="page_nav">
    <div class="nav_tit">
      <h3>예초 작업</h3>
      <ul>
        <li>HOME</li>
        <li>서비스</li>
        <li class="_last">예초 작업</li>
      </ul>
    </div>
  </div>

  <div class="ba-section">
    <div class="ba-box">
      <div class="ba-info">
        <div>Name 수피다</div>
        <div>Date 2023-10-10</div>
        <div>Hit 225</div>
      </div>
      <div class="ba-content">
        <img src="나무전지후.png" class="ba-after-img" loading="lazy">
        <div class="ba-after-label">AFTER</div>
        <div class="ba-before-card">
          <img src="나무전지전.png" loading="lazy">
          <div class="ba-before-label">BEFORE</div>
        </div>
      </div>
      <div class="ba-desc">예초 작업</div>
    </div>
  </div>

</div>

<script>
document.querySelectorAll('.main-menu').forEach(menu => {
  menu.addEventListener('click', (e) => {
    if (window.innerWidth <= 980) {
      e.preventDefault();
      const sub = menu.nextElementSibling;
      sub.style.display = (sub.style.display === 'block') ? 'none' : 'block';
    }
  });
});

const navBtn = document.querySelector('.nav-btn');
const nav = document.querySelector('#nav');
const navBg = document.querySelector('.nav-bg');
navBtn.addEventListener('click', () => { nav.classList.toggle('open'); navBg.classList.toggle('active'); });
navBg.addEventListener('click', () => { nav.classList.remove('open'); navBg.classList.remove('active'); });
</script>
<script src="/auth.js"></script>
</body>
</html>
