  <style>
    .nav-btn { width:28px; height:22px; display:none; flex-direction:column; justify-content:space-between; cursor:pointer; z-index:9999; }
    .nav-btn span { display:block; width:100%; height:3px; background:#002157; border-radius:3px; }
    @media (max-width:980px) {
      #nav { position:fixed; top:0; right:-260px; width:260px; height:100vh; background:white; padding:80px 30px; display:flex !important; flex-direction:column; gap:25px; transition:right .3s ease; z-index:9998; box-shadow:-4px 0 12px rgba(0,0,0,0.2); }
      #nav.open { right:0; }
      .nav-btn { display:flex; }
      .nav-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); display:none; z-index:9990; }
      .nav-bg.active { display:block !important; }
    }
    .slider { position:relative; height:600px; overflow:hidden; }
    .slide { position:absolute; width:100%; height:100%; opacity:0; transition:1s; }
    .slide.active { opacity:1; }
    .slide img { width:100%; height:100%; object-fit:cover; }
    .text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; text-align:center; }
    .text h1 { font-size:50px; }
    .text p { font-size:20px; }
    .map-section { padding:40px 20px; max-width:700px; margin:0 auto; text-align:center; }
    .map-wrap { display:flex; justify-content:center; }
    .map-info { margin-top:24px; text-align:left; display:inline-block; background:#f9f9f9; border-radius:12px; padding:20px 30px; line-height:2; font-size:16px; }
    .map-info p { margin:0; }
    .map-info a { color:#001c54; font-weight:bold; text-decoration:none; }
    .map-info a:hover { text-decoration:underline; }
  </style>
</head>

<script>
document.querySelectorAll('.main-menu').forEach(menu => {
  menu.addEventListener('click', (e) => {
    if (window.innerWidth <= 980) {
      e.preventDefault();
      const sub = menu.nextElementSibling;
      sub.style.display = (sub.style.display === 'block') ? 'none' : 'block';
    }
  });
});

const navBtn = document.querySelector('.nav-btn');
const nav = document.querySelector('#nav');
const navBg = document.querySelector('.nav-bg');
navBtn.addEventListener('click', () => { nav.classList.toggle('open'); navBg.classList.toggle('active'); });
navBg.addEventListener('click', () => { nav.classList.remove('open'); navBg.classList.remove('active'); });
</script>
<script src="/auth.js"></script>
