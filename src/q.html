<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link href="user2.css" rel="stylesheet">
  <link href="Custom1.css" rel="stylesheet">
  <link href="Custom2.css" rel="stylesheet">
  <style>
    .nav-btn { width:28px; height:22px; display:none; flex-direction:column; justify-content:space-between; cursor:pointer; z-index:9999; }
    .sub-menu a { background:white !important; }
    .nav-btn span { display:block; width:100%; height:3px; background:#002157; border-radius:3px; }
    @media (max-width:980px) {
      #nav { position:fixed; top:0; right:-260px; width:260px; height:100vh; background:white; padding:80px 30px; display:flex !important; flex-direction:column; gap:25px; transition:right .3s ease; z-index:9998; box-shadow:-4px 0 12px rgba(0,0,0,0.2); }
      #nav.open { right:0; }
      .nav-btn { display:flex; }
      .nav-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); display:none; z-index:9990; }
      .nav-bg.active { display:block !important; }
    }
    .form-table { width:100%; border-collapse:collapse; }
    .form-table td { border-bottom:1px solid #ddd; padding:12px; }
    .label { width:150px; background:#f5f5f5; }
    input[type="text"], input[type="password"] { width:300px; padding:6px; }
    textarea { width:100%; height:300px; padding:10px; box-sizing:border-box; }
    .btn-area { text-align:center; margin-top:20px; }
    .btn-area button { padding:10px 20px; margin:5px; cursor:pointer; }
  </style>
</head>
<body>
<div id="wrapper">
  <div id="header">
    <div id="header_in">
      <div id="L_SITE_LOGO">
        <h1><a href="/"><img src="logo1.png" width="120" height="50" border="0"></a></h1>
      </div>
      <div class="nav-btn"><span></span><span></span><span></span></div>
      <nav id="nav">
        <div class="util-menu">
          <ul>
            <li id="loginMenu"><a href="/login">LOGIN</a></li>
            <li id="joinMenu"><a href="/join">JOIN</a></li>
            <li id="logoutMenu" style="display:none;"><a href="#" onclick="logout()">LOGOUT</a></li>
          </ul>
        </div>
        <h2 class="hidden">사이트 메뉴</h2>
        <ul class="navigation">
          <li>
            <a href="#" class="main-menu">회사소개</a>
            <div class="sub-menu">
              <a href="/boss">회사 소개</a>
              <a href="/map">찾아오시는 길</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">예초 작업</a>
            <div class="sub-menu">
              <a href="/menu1">작업 소개</a>
              <a href="/menu2">시공 사례</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">위험 수목</a>
            <div class="sub-menu">
              <a href="/menu3">작업 소개</a>
              <a href="/menu4">시공 사례</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">고객센터</a>
            <div class="sub-menu">
              <a href="/FAQ">FAQ</a>
              <a href="/qna">문의하기</a>
              <a href="/estimate">견적 계산기</a>
            </div>
          </li>
        </ul>
      </nav>
      <div class="nav-bg"></div>
    </div>
  </div>

  <div class="page_nav">
    <div class="nav_tit">
      <h3>문의하기</h3>
      <ul>
        <li>HOME</li>
        <li>고객센터</li>
        <li class="_last">문의 작성</li>
      </ul>
    </div>
  </div>

  <div id="subContents">
    <div class="sub-contents">
      <div class="sub1-2">
        <div class="subtit">
          <div class="tit"><h3>문의하기</h3></div>
          <div class="subtit_line"></div>
        </div>

        <form id="qna-form">
          <table class="form-table">
            <tr>
              <td class="label">이름</td>
              <td><input type="text" id="name" placeholder="이름을 입력해 주세요." required></td>
            </tr>
            <tr>
              <td class="label">비밀글</td>
              <td>
                <label><input type="radio" name="secret" value="y"> 예</label>
                <label><input type="radio" name="secret" value="n" checked> 아니오</label>
              </td>
            </tr>
            <tr>
              <td class="label">비밀번호</td>
              <td><input type="password" id="password" placeholder="비밀글 시 입력"></td>
            </tr>
            <tr>
              <td colspan="2">
                <input type="text" id="title" placeholder="제목을 입력해 주세요." style="width:100%;padding:10px;" required>
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
              </td>
            </tr>
          </table>
          <div class="btn-area">
            <button type="submit">등록</button>
            <button type="button" onclick="history.back()">취소</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('qna-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: document.getElementById('name').value,
    title: document.getElementById('title').value,
    content: document.getElementById('content').value,
    secret: document.querySelector('input[name=secret]:checked').value,
    password: document.getElementById('password').value,
  };
  const res = await fetch('/api/qna', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.ok) {
    alert('문의가 등록되었습니다!');
    location.href = '/qna';
  } else {
    alert('오류가 발생했어요. 다시 시도해 주세요.');
  }
});

// 모바일 메뉴
const navBtn = document.querySelector('.nav-btn');
const nav = document.querySelector('#nav');
const navBg = document.querySelector('.nav-bg');
navBtn.addEventListener('click', () => { nav.classList.toggle('open'); navBg.classList.toggle('active'); });
navBg.addEventListener('click', () => { nav.classList.remove('open'); navBg.classList.remove('active'); });
</script>
<script src="/auth.js"></script>
</body>
</html>
