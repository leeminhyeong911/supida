<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link href="/user2.css" rel="stylesheet">
  <link href="/Custom1.css" rel="stylesheet">
  <link href="/Custom2.css" rel="stylesheet">
  <style>
    .nav-btn { width:28px; height:22px; display:none; flex-direction:column; justify-content:space-between; cursor:pointer; z-index:9999; }
    .nav-btn span { display:block; width:100%; height:3px; background:#002157; border-radius:3px; }
    @media (max-width:980px) {
      #nav { position:fixed; top:0; right:-260px; width:260px; height:100vh; background:white; padding:80px 30px; display:flex !important; flex-direction:column; gap:25px; transition:right .3s ease; z-index:9998; box-shadow:-4px 0 12px rgba(0,0,0,0.2); }
      #nav.open { right:0; }
      .nav-btn { display:flex; }
      .nav-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); display:none; z-index:9990; }
      .nav-bg.active { display:block !important; }
    }
    .detail-table { width:100%; border-collapse:collapse; }
    .detail-table td { border-bottom:1px solid #ddd; padding:12px; }
    .label { width:150px; background:#f5f5f5; font-weight:bold; }
    .content-area { min-height:200px; padding:20px; line-height:1.8; }
    .btn-area { text-align:center; margin-top:20px; }
    .btn-area button { padding:10px 20px; margin:5px; cursor:pointer; }
    .answer-box { background:#f5f8ff; border-left:4px solid #001c54; padding:20px; margin-top:20px; }
    .answer-box h4 { color:#001c54; margin:0 0 10px 0; }
    .answer-form { margin-top:20px; }
    .answer-form textarea { width:100%; height:120px; padding:10px; box-sizing:border-box; border:1px solid #ddd; }
  </style>
</head>
<body>
<div id="wrapper">
  <div id="header">
    <div id="header_in">
      <div id="L_SITE_LOGO">
        <h1><a href="/"><img src="/logo1.png" width="120" height="50" border="0" loading="lazy"></a></h1>
      </div>
      <div class="nav-btn"><span></span><span></span><span></span></div>
      <nav id="nav">
        <div class="util-menu" style="visibility:hidden;">
          <ul>
            <li id="loginMenu"><a href="/login">LOGIN</a></li>
            <li id="joinMenu"><a href="/join">JOIN</a></li>
            <li id="logoutMenu" style="display:none;"><a href="#" onclick="logoutUser()">LOGOUT</a></li>
          </ul>
        </div>
        <h2 class="hidden">사이트 메뉴</h2>
        <ul class="navigation">
          <li>
            <a href="#" class="main-menu">회사소개</a>
            <div class="sub-menu">
              <a href="/boss">회사 소개</a>
              <a href="/map">찾아오시는 길</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">예초 작업</a>
            <div class="sub-menu">
              <a href="/menu1">작업 소개</a>
              <a href="/menu2">시공 사례</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">위험 수목</a>
            <div class="sub-menu">
              <a href="/menu3">작업 소개</a>
              <a href="/menu4">시공 사례</a>
            </div>
          </li>
          <li>
            <a href="#" class="main-menu">고객센터</a>
            <div class="sub-menu">
              <a href="/FAQ">FAQ</a>
              <a href="/qna">문의하기</a>
              <a href="/estimate">견적 계산기</a>
            </div>
          </li>
        </ul>
      </nav>
      <div class="nav-bg"></div>
    </div>
  </div>

  <div class="page_nav">
    <div class="nav_tit">
      <h3>문의하기</h3>
      <ul>
        <li>HOME</li>
        <li>고객센터</li>
        <li class="_last">문의 상세</li>
      </ul>
    </div>
  </div>

  <div id="subContents">
    <div class="sub-contents">
      <div class="sub1-2">
        <div class="subtit">
          <div class="tit"><h3>문의 상세</h3></div>
          <div class="subtit_line"></div>
        </div>

        <table class="detail-table">
          <tr><td class="label">제목</td><td id="detail-title">로딩 중...</td></tr>
          <tr><td class="label">작성자</td><td id="detail-name"></td></tr>
          <tr><td class="label">날짜</td><td id="detail-date"></td></tr>
          <tr><td class="label">조회수</td><td id="detail-views"></td></tr>
          <tr><td class="label">상태</td><td id="detail-status"></td></tr>
          <tr><td colspan="2" class="content-area" id="detail-content"></td></tr>
        </table>

        <div class="answer-box" id="answer-box" style="display:none;">
          <h4>✅ 관리자 답변</h4>
          <div id="answer-content"></div>
          <div style="font-size:12px;color:#999;margin-top:8px;" id="answer-date"></div>
        </div>

        <div class="answer-form" id="answer-form" style="display:none;">
          <h4>답변 작성 (관리자)</h4>
          <textarea id="answer-input" placeholder="답변을 입력하세요"></textarea>
          <div class="btn-area">
            <button onclick="submitAnswer()">답변 등록</button>
          </div>
        </div>

        <div class="btn-area">
          <button onclick="location.href='/qna'">← 목록으로</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const id = location.pathname.split('/').pop();

fetch(`/api/qna/${id}`)
  .then(res => res.json())
  .then(data => {
    document.getElementById('detail-title').textContent = data.secret ? '🔒 비밀글' : data.title;
    document.getElementById('detail-name').textContent = data.name;
    document.getElementById('detail-date').textContent = new Date(data.createdAt).toLocaleDateString('ko-KR');
    document.getElementById('detail-views').textContent = data.views;
    document.getElementById('detail-content').textContent = data.secret ? '비밀글입니다.' : data.content;
    document.getElementById('detail-status').textContent = data.answer ? '✅ 답변완료' : '⏳ 대기중';
    if (data.answer) {
      document.getElementById('answer-box').style.display = 'block';
      document.getElementById('answer-content').textContent = data.answer;
      document.getElementById('answer-date').textContent = new Date(data.answeredAt).toLocaleDateString('ko-KR');
    }
  });

fetch('/api/me').then(res => res.json()).then(data => {
  if (data.isAdmin) document.getElementById('answer-form').style.display = 'block';
});

async function submitAnswer() {
  const answer = document.getElementById('answer-input').value.trim();
  if (!answer) return alert('답변을 입력해주세요.');
  const res = await fetch(`/api/qna/${id}/answer`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answer })
  });
  const data = await res.json();
  if (data.ok) { alert('답변이 등록되었습니다!'); location.reload(); }
  else alert('권한이 없어요.');
}

const navBtn = document.querySelector('.nav-btn');
const nav = document.querySelector('#nav');
const navBg = document.querySelector('.nav-bg');
navBtn.addEventListener('click', () => { nav.classList.toggle('open'); navBg.classList.toggle('active'); });
navBg.addEventListener('click', () => { nav.classList.remove('open'); navBg.classList.remove('active'); });
</script>
<script src="/auth.js"></script>
</body>
</html>
